name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # This library is consumed by checkout-service-kotlin, which pins the
      # coordinate com.acme:pricing-lib:1.8.2. Nothing in this pipeline knows
      # that, so a source-compatible change that alters behaviour is not caught
      # on this side of the boundary.
      - name: Build and test
        run: gradle build --console=plain
